<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xxkaw版本选择</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        .btn {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .new-btn {
            background-color: #4CAF50;
            color: white;
        }
        .old-btn {
            background-color: #2196F3;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>请选择xxjaw版本</h1>
        <button class="btn new-btn" onclick="openNewVersion()">新版</button>
        <button class="btn old-btn" onclick="openOldVersion()">旧版</button>
    </div>

    <script>
        function openNewVersion() {
            window.location.href = "xbxxjaw.html";
        }
        
        function openOldVersion() {
            window.location.href = "kdss.html";
        }
    </script>
</body>
</html>
